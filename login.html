<!DOCTYPE html>
<html>
  <head>
    <title>Login - Amazon Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/login.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img class="amazon-logo" src="images/amazon-logo-white.png">
          <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png">
        </a>
      </div>
    </div>

    <div class="main">
      <div class="login-container">
        <h1>Sign-In</h1>
        <form class="login-form js-login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input js-email-input" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input js-password-input" required>
          </div>
          <button type="submit" class="login-button">Sign-In</button>
        </form>
        <div class="register-section">
          <p>New to Amazon?</p>
          <a href="register.html" class="register-button">Create your Amazon account</a>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/login.js"></script>
  </body>
</html>
