<!DOCTYPE html>
<html>
  <head>
    <title>Register - Amazon Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/shared/general.css">
    <link rel="stylesheet" href="styles/shared/amazon-header.css">
    <link rel="stylesheet" href="styles/pages/login.css">
  </head>
  <body>
    <div class="amazon-header">
      <div class="amazon-header-left-section">
        <a href="amazon.html" class="header-link">
          <img class="amazon-logo" src="images/amazon-logo-white.png">
          <img class="amazon-mobile-logo" src="images/amazon-mobile-logo-white.png">
        </a>
      </div>
    </div>

    <div class="main">
      <div class="login-container">
        <h1>Create Account</h1>
        <form class="login-form js-register-form">
          <div class="form-group">
            <label for="name">Your name</label>
            <input type="text" id="name" class="form-input js-name-input" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-input js-email-input" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-input js-password-input" placeholder="At least 6 characters" required minlength="6">
          </div>
          <div class="form-group">
            <label for="password-check">Re-enter password</label>
            <input type="password" id="password-check" class="form-input js-password-check-input" required>
          </div>
          <button type="submit" class="login-button">Create your Amazon account</button>
        </form>
        <div class="register-section">
          <p>Already have an account? <a href="login.html">Sign in</a></p>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/register.js"></script>
  </body>
</html>
